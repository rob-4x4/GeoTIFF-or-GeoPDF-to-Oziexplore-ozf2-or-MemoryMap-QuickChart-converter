name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GDAL and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gdal-bin
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run automated tests
        run: python geotiff_to_qct.py --test
